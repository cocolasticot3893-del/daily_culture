<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Le Banquet des Muses - Daily Culture</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Le Banquet des Muses</span>
      <span class="brand-sub" id="todayDateLabel">Exploration culturelle</span>
    </div>
    <div class="stats-pill" title="Fiches archivees et serie en cours">
      <span id="totalCountBadge">0 fiches</span>
      <span>&#8226;</span>
      <span id="streakBadge">0j</span>
    </div>
  </header>

  <main class="container">
    <section id="view-today" class="view active">
      <div class="controls-bar">
        <select id="categorySelect" aria-label="Choisir une categorie culturelle">
          <option value="AUTO">Tirage equilibre (14 domaines)</option>
        </select>
        <button id="generateBtn" class="btn-primary">Generer</button>
      </div>
      <div id="todayContent"></div>
    </section>

    <section id="view-archives" class="view">
      <div class="controls-bar">
        <input type="text" id="searchInput" placeholder="Rechercher un concept, auteur, oeuvre..." />
        <select id="archiveCategoryFilter" aria-label="Filtrer par categorie">
          <option value="ALL">Toutes</option>
        </select>
      </div>
      <div id="archivesList"></div>
    </section>

    <section id="view-favorites" class="view">
      <div id="favoritesList"></div>
    </section>

    <section id="view-settings" class="view">
      <div class="card">
        <h2 style="font-size:1.1rem; margin-bottom:14px; color:var(--gold);">API Gemini &amp; Modeles Dynamiques</h2>

        <div class="form-group">
          <label for="apiKeyInput">Cle API Google Gemini (AI Studio)</label>
          <input type="password" id="apiKeyInput" placeholder="AIzaSy..." autocomplete="off" />
          <p class="help-text">Stockee uniquement en local (localStorage). Synchronise automatiquement les modeles via GET /v1beta/models.</p>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label for="modelSelect" style="margin:0;">Modele Gemini</label>
            <button type="button" id="refreshModelsBtn" class="btn-secondary btn-sm">Synchroniser les modeles</button>
          </div>
          <select id="modelSelect">
            <option value="gemini-flash-latest">gemini-flash-latest (Defaut stable)</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
          </select>
          <p class="help-text" id="modelsStatusText">Synchronisation automatique au chargement avec votre cle API.</p>
        </div>

        <div class="form-group">
          <label for="depthSelect">Densite editoriale</label>
          <select id="depthSelect">
            <option value="dense">Synthese dense (lecture 3 min, haute precision)</option>
            <option value="deep">Analyse approfondie (lecture 6 min, nuances academiques)</option>
          </select>
        </div>

        <button id="saveSettingsBtn" class="btn-primary" style="width:100%;">Enregistrer les parametres</button>
      </div>

      <div class="card">
        <h2 style="font-size:1.1rem; margin-bottom:12px; color:var(--gold);">Sauvegarde &amp; Export Anki (FSRS)</h2>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button id="exportAllAnkiBtn" class="btn-secondary">Exporter toutes les flashcards (Anki .tsv)</button>
          <button id="exportJsonBtn" class="btn-secondary">Exporter la base complete (JSON)</button>
          <label class="btn-secondary" style="text-align:center; cursor:pointer;">
            Importer une sauvegarde JSON
            <input type="file" id="importJsonInput" accept=".json" style="display:none;" />
          </label>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav-btn active" data-target="today">
      <span class="nav-icon">&#9672;</span>
      <span>Decouverte</span>
    </button>
    <button class="nav-btn" data-target="archives">
      <span class="nav-icon">&#9776;</span>
      <span>Archives</span>
    </button>
    <button class="nav-btn" data-target="favorites">
      <span class="nav-icon">&#9733;</span>
      <span>Favoris</span>
    </button>
    <button class="nav-btn" data-target="settings">
      <span class="nav-icon">&#9881;</span>
      <span>Config</span>
    </button>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
